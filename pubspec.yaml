name: budget_buddy
description: BuddgetBuddy — A Flutter Money Management App with GetX and Hive
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.2
  intl: ^0.20.2
  google_fonts: ^6.1.0
  fl_chart: ^0.70.0
  # CSV export (F-13). Exact pins, no caret: a share sheet and a file path are
  # exactly the places where a silent minor-version bump changes native
  # behaviour, and this app has no CI matrix to catch it.
  #
  # share_plus 12.0.1 declares minSdk 19 (ours is 24, so no bump — a bump would
  # have been a hard stop) and ships no <uses-permission> of its own: an
  # unexported FileProvider and a receiver, nothing more.
  #
  # path_provider was already resolving transitively through hive_flutter at
  # this exact version; naming it here is free and stops the export's temp
  # directory depending on another package's dependency list.
  share_plus: 12.0.1
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
