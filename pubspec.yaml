name: budget_buddy
description: BuddgetBuddy — A Flutter Money Management App with GetX and Hive
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.2
  intl: ^0.20.2
  google_fonts: ^6.1.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.0
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  google_sign_in: ^6.2.2
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.1.0
  connectivity_plus: ^7.0.0
  fl_chart: ^0.70.0
  firebase_crashlytics: ^5.0.8
  firebase_analytics: ^12.1.3
  firebase_remote_config: ^6.2.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
